server:
  port: 8801
  servlet:
    context-path: /mifss/bio

# Dubbo 配置
dubbo:
  application:
    name: mifss-bio
    logger: slf4j
  protocol:
    name: dubbo
    port: -1
  consumer:
    timeout: 60000 #远程服务调用超时时间(毫秒)
  provider:
    retries: 0 #远程服务调用重试次数，不包括第一次调用，不需要重试请设为0
  registry:
    address: zookeeper://127.0.0.1:2181
    timeout: 10000
  metadata-report:
    address: zookeeper://127.0.0.1:2181

spring:
  application:
    name: mifss-bio
  main:
    allow-bean-definition-overriding: true
  profiles:
    active:
      - generic
      - ev-test
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://127.0.0.1:3306/medicare_202588?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=Asia/Shanghai
    username: root
    password: 123456

mybatis-plus:
  configuration:
    # 这里的 log-impl 会将 SQL 打印到控制台
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

security:
  type: hsa-sso
  isPrivilege: true
  oauth2:
    client:
      permits: /,/index.html,/home,/home/**,/login,/logout,/user/forceLogout**,/captcha,/assets/**,/favicon.ico,/doc.html,/swagger-ui.html,/swagger-ui.html/**,/webjars/**,/*/api-docs,/v2/**,/**/swagger-resources/**

cache:
  alone:
    deployType: 1
    cacheName: defaultCache
    clusterNodes: 127.0.0.1:6379
    password: 123456
  cluster:
    deployType: 2
    cacheName: defaultCache
    clusterNodes: 127.0.0.1:6379
    password: 123456
    maxRedirects: 3

session:
  redis:
    host: 127.0.0.1
    password: 123456
    port: 6379
    database: 5
    timeout: 6000
    pool:
      maxIdle: 50
      maxTotal: 100
      maxWaitMillis: -1
      testOnBorrow: true
      testOnReturn: true

fsstore:
  type: minio
  bucket: group1

mio:
  endpoint: http://192.168.17.13:9900
  accessKeyId: aeye
  secretAccessKey: Zhy778899

swagger:
  title: MIFSS BIO API
  description: MIFSS 生物特征识别服务 API 文档
  version: 1.0.0

# HSAF 全局序列号生成器
idgenerator:
  common:
    type: sf

# MQ 消息队列测试主题#########################################################################
mq:
  #rocketMQ/kafka,默认rocketMQ，只针对开源版本有效
  type: rocketMQ
  topic_crtf:
    name: MQ_IMS_CRTF_TEST
    group_crtf:
      id: GID_IMS_CRTF_GROUP
      tag: crtf
      queue: TENCENT_QUEUE_CRTF_TEST
  ali:
    # 您的阿里云账号的 AccessKeyId
    AccessKey: 1
    # 您的阿里云账号的 AccessKeySecret
    SecretKey: 1
    # 您的消息队列 RocketMQ 实例的 TCP 接入点，可在控制台的实例管理的获取接入点信息区域获取 TCP 协议接入点
    NAMESRV_ADDR: 192.168.16.148:9876
# MQ 消息队列测试主题#########################################################################
